name: Production canteen menu sync

on:
  schedule:
    # GitHub schedules are UTC. Half-hour ticks let the database scheduler act
    # on provider publication boundaries; a tick with no due source performs
    # no provider request. 00:17–15:47 UTC = 08:17–23:47 HKT.
    - cron: "17,47 0-15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-canteen-menu-sync
  cancel-in-progress: false

jobs:
  drain:
    name: Drain due menu sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Drain production menu sources
        env:
          MENU_SYNC_TRIGGER_SECRET: ${{ secrets.MENU_SYNC_TRIGGER_SECRET }}
        run: node scripts/drain-canteen-menu-sync.mjs
