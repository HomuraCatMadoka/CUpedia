name: Production canteen menu sync

on:
  schedule:
    # GitHub schedules are UTC. Supabase owns the primary 00:17–00:32,
    # 03:17–03:32, and 09:17–09:32 drains. GitHub waits until :37 in those
    # hours so a fallback completion is attributable, while the existing :47
    # and non-primary publication-refresh wakeups remain unchanged.
    - cron: "37,47 0,3,9 * * *"
    - cron: "17,47 1-2,4-8,10-15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-canteen-menu-sync
  cancel-in-progress: false

jobs:
  drain:
    name: Drain due menu sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Drain production menu sources
        env:
          MENU_SYNC_TRIGGER_SECRET: ${{ secrets.MENU_SYNC_TRIGGER_SECRET }}
        run: node scripts/drain-canteen-menu-sync.mjs
