name: Seoul isolated manual release

on:
  workflow_dispatch:

permissions: {}

jobs:
  select-rehearsal-branch:
    name: Select the isolated rehearsal branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Show the branch to select
        run: |
          printf '%s\n' \
            'Choose `codex/seoul-manual-release` in the **Run workflow** branch menu to run the isolated Seoul rehearsal.' \
            >> "$GITHUB_STEP_SUMMARY"
