name: Seoul private registry rehearsal

on:
  push:
    branches: [codex/seoul-private-rehearsal-20261126]

permissions:
  contents: read

concurrency:
  group: seoul-private-rehearsal-20261126
  cancel-in-progress: false

jobs:
  checks:
    name: Verify the rehearsal source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck

  publish:
    name: Build and publish privately over SSH
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: seoul-private-publish-20261126
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the linux/amd64 image
        run: |
          docker buildx build --load \
            --file deploy/seoul-rehearsal/Dockerfile \
            --platform linux/amd64 \
            --build-arg NEXT_BUILD_SKIP_TYPECHECK=1 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "127.0.0.1:5105/cupedia-rehearsal:rehearsal-$GITHUB_SHA" .
      - name: Publish and verify anonymous access is denied
        id: publish
        env:
          SEOUL_TRIAL_HOST: ${{ secrets.SEOUL_TRIAL_HOST }}
          SEOUL_TRIAL_PORT: ${{ secrets.SEOUL_TRIAL_PORT }}
          SEOUL_TRIAL_HOST_KEY: ${{ secrets.SEOUL_TRIAL_HOST_KEY }}
          SEOUL_TRIAL_SSH_KEY: ${{ secrets.SEOUL_TRIAL_SSH_KEY }}
          SEOUL_TRIAL_REGISTRY_CA: ${{ secrets.SEOUL_TRIAL_REGISTRY_CA }}
          SEOUL_TRIAL_REGISTRY_WRITER: ${{ secrets.SEOUL_TRIAL_REGISTRY_WRITER }}
        run: python3 -I deploy/seoul-rehearsal/private-registry-workflow.py publish

  rehearse:
    name: Read-only pull, deploy, check and roll back
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: seoul-private-deploy-20261126
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rehearse deployment and rollback in Seoul
        env:
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
          SEOUL_TRIAL_HOST: ${{ secrets.SEOUL_TRIAL_HOST }}
          SEOUL_TRIAL_PORT: ${{ secrets.SEOUL_TRIAL_PORT }}
          SEOUL_TRIAL_HOST_KEY: ${{ secrets.SEOUL_TRIAL_HOST_KEY }}
          SEOUL_TRIAL_SSH_KEY: ${{ secrets.SEOUL_TRIAL_SSH_KEY }}
        run: python3 -I deploy/seoul-rehearsal/private-registry-workflow.py rehearse
