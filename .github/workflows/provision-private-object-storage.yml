name: Verify private object storage bucket

on:
  workflow_dispatch:
    inputs:
      private_bucket:
        description: New private bucket name (must not already exist)
        required: true
        default: cuclaw-private-uploads
        type: string
      confirmation:
        description: Type the private bucket name again to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-private-object-storage
  cancel-in-progress: false

jobs:
  provision:
    name: Verify private bucket access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify existing private bucket
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          MINIO_REGION: ${{ secrets.MINIO_REGION }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_PRIVATE_BUCKET: ${{ inputs.private_bucket }}
          PROVISION_PRIVATE_BUCKET_CONFIRM: ${{ inputs.confirmation }}
          VERIFY_EXISTING_PRIVATE_BUCKET: "1"
        run: pnpm storage:create-private
