name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
        name: Lint

      - run: pnpm test
        name: Unit tests

      - run: pnpm typecheck
        name: Typecheck

  database-integration:
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5434/cuclaw_menu_sync_test
      AUTH_SECRET: ci-placeholder-secret
      AUTH_URL: http://localhost:3100
      E2E_CI_GROUPS: "1"
    services:
      migration-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cuclaw_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cuclaw_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      zhparser-postgres:
        image: abcfy2/zhparser:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cuclaw_menu_sync_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cuclaw_menu_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Download Next build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Extract Next build
        run: tar -xzf next-build.tar.gz

      - run: pnpm install --frozen-lockfile

      - name: Test legacy migration and preflight compatibility
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cuclaw_migration_test
          MIGRATION_COMPATIBILITY_TEST: "1"
          MENU_IDENTITY_PREFLIGHT_TEST: "1"
        run: >-
          pnpm exec vitest run
          tests/db/canteen-menu-source-migration.test.ts
          tests/db/canteen-menu-identity-preflight.test.ts

      - name: Initialize zhparser
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/cuclaw_menu_sync_test
        run: psql "$DATABASE_URL" -f init-zhparser.sql

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/cuclaw_menu_sync_test
        run: pnpm drizzle-kit migrate

      - name: Test menu sync persistence
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/cuclaw_menu_sync_test
        run: >-
          pnpm exec vitest run
          tests/db/canteen-menu-sync.test.ts
          tests/db/canteen-menu-source-sync.test.ts

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: ci-placeholder-secret
          AUTH_URL: http://localhost:3000
          NEXT_BUILD_SKIP_TYPECHECK: "1"

      - run: pnpm bundle:check
        name: Check client bundle budgets

      - name: Package Next build
        run: tar -czf next-build.tar.gz --exclude=.next/cache .next

      - name: Upload Next build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Two Chromium runners share one production Next build and own the broad
  # regression surface. A third runner limits WebKit to known interaction risks.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-general
            browser: chromium
            install_args: --only-shell
            minio: false
          - project: chromium-wiki-media
            browser: chromium
            install_args: --only-shell
            minio: true
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/cuclaw
      AUTH_SECRET: ci-placeholder-secret
      AUTH_URL: http://localhost:3100
      E2E_CI_GROUPS: "1"
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: cuclaw-uploads
      MINIO_PUBLIC_URL: http://localhost:9000/cuclaw-uploads
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Download Next build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Extract Next build
        run: tar -xzf next-build.tar.gz

      - run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL
        run: docker compose up -d --wait db

      - name: Start MinIO
        if: matrix.minio
        run: docker compose up -d --wait minio

      - name: Create uploads bucket
        if: matrix.minio
        run: docker compose run --rm createbuckets

      # global-setup provisions the isolated `cuclaw_e2e` db (create + zhparser
      # + migrate + seed), so no separate migrate step is needed here.

      - name: Install Playwright browser
        run: pnpm exec playwright install ${{ matrix.install_args }} ${{ matrix.browser }}

      - name: Run e2e
        run: pnpm test:e2e --project=${{ matrix.project }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  webkit-risk:
    runs-on: ubuntu-latest
    needs: build
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cuclaw
      AUTH_SECRET: ci-placeholder-secret
      AUTH_URL: http://localhost:3100
      E2E_CI_GROUPS: "1"
    services:
      postgres:
        image: abcfy2/zhparser:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cuclaw
        options: >-
          --health-cmd "pg_isready -U postgres -d cuclaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Download Next build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Extract Next build
        run: tar -xzf next-build.tar.gz

      - run: pnpm install --frozen-lockfile

      - name: Trust container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run WebKit risk coverage
        run: pnpm test:e2e --project=webkit-mobile

      - name: Upload WebKit artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit-mobile
          path: |
            playwright-report/
            test-results/
          retention-days: 7
