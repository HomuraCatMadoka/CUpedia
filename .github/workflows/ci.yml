name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
        name: Lint

      - run: pnpm test
        name: Test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
        name: Typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: ci-placeholder-secret
          AUTH_URL: http://localhost:3000
          NEXT_BUILD_SKIP_TYPECHECK: "1"

      - run: pnpm bundle:check
        name: Check client bundle budgets

      - name: Package Next build
        run: tar -czf next-build.tar.gz --exclude=.next/cache .next

      - name: Upload Next build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Non-blocking gate (not in branch-protection required checks yet): runs the
  # Playwright suite against the same zhparser Postgres the dev stack uses, so
  # cross-spec regressions (e.g. the #90 H1 break) surface on every PR. Promote
  # to required once it proves stable.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-general
            browser: chromium
            install_args: --only-shell
          - project: chromium-wiki
            browser: chromium
            install_args: --only-shell
          - project: chromium-wiki-editor
            browser: chromium
            install_args: --only-shell
          - project: webkit-mobile
            browser: webkit
            install_args: --with-deps --only-shell
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/cuclaw
      AUTH_SECRET: ci-placeholder-secret
      AUTH_URL: http://localhost:3100
      E2E_CI_GROUPS: "1"
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: cuclaw-uploads
      MINIO_PUBLIC_URL: http://localhost:9000/cuclaw-uploads
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Download Next build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Extract Next build
        run: tar -xzf next-build.tar.gz

      - run: pnpm install --frozen-lockfile

      - name: Start Postgres and MinIO
        run: docker compose up -d --wait db minio

      - name: Create uploads bucket
        run: docker compose run --rm createbuckets

      # global-setup provisions the isolated `cuclaw_e2e` db (create + zhparser
      # + migrate + seed), so no separate migrate step is needed here.

      - name: Install Playwright browser
        run: pnpm exec playwright install ${{ matrix.install_args }} ${{ matrix.browser }}

      - name: Run e2e
        run: pnpm test:e2e --project=${{ matrix.project }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
