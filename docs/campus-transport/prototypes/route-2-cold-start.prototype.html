<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#55286f"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#211426"
      media="(prefers-color-scheme: dark)"
    />
    <title>中大校巴 - 路線詳情 UI 原型</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
    />
    <style>
      :root {
        color-scheme: light dark;
        --accent: #55286f;
        --accent-strong: #402054;
        --accent-soft: #f2eaf7;
        --accent-line: #a67cba;
        --page: #eef0f2;
        --surface: #fbfbfc;
        --surface-muted: #f3f4f6;
        --surface-strong: #e6e8eb;
        --accent-hover: #f4eff6;
        --ink: #1c2024;
        --muted: #66707a;
        --line: #d9dde1;
        --line-subtle: #e3e6e8;
        --positive: #176b4d;
        --warning: #7a4d0b;
        --danger: #a43a42;
        --focus: #1877c9;
        --radius: 14px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          "PingFang TC", "Microsoft JhengHei", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #b58ac8;
          --accent-strong: #d4b8df;
          --accent-soft: #2e2035;
          --accent-line: #886b96;
          --page: #111316;
          --surface: #191c20;
          --surface-muted: #22262b;
          --surface-strong: #2d3238;
          --accent-hover: #2a2030;
          --ink: #f0f2f4;
          --muted: #a8b0b8;
          --line: #343941;
          --line-subtle: #2b3036;
          --positive: #72c8a4;
          --warning: #e2b871;
          --danger: #f29299;
          --focus: #6eb7f2;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page);
      }

      body {
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
        background: var(--page);
        color: var(--ink);
        -webkit-tap-highlight-color: color-mix(
          in srgb,
          var(--accent) 18%,
          transparent
        );
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      select,
      summary,
      a {
        touch-action: manipulation;
      }

      button {
        color: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .skip-link {
        position: fixed;
        z-index: 30;
        top: 8px;
        left: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        transform: translateY(-150%);
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .app {
        width: min(100%, 560px);
        min-height: 100dvh;
        margin: 0 auto;
        overflow: hidden;
        background: var(--surface);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--line) 76%, transparent);
      }

      .screen[hidden] {
        display: none;
      }

      .app-bar {
        position: sticky;
        z-index: 10;
        top: 0;
        display: grid;
        min-height: calc(64px + env(safe-area-inset-top));
        grid-template-columns: 48px minmax(0, 1fr) 48px;
        align-items: end;
        padding: calc(10px + env(safe-area-inset-top)) 10px 10px;
        background: var(--accent);
        color: #fffafc;
      }

      .app-bar.home-bar {
        grid-template-columns: 1fr;
        align-items: center;
      }

      .app-brand,
      .bar-title {
        min-width: 0;
      }

      .app-brand strong,
      .bar-title strong {
        display: block;
        overflow: hidden;
        font-size: 1.13rem;
        font-weight: 750;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .app-brand small,
      .bar-title small {
        display: block;
        margin-top: 2px;
        color: rgba(255, 250, 252, 0.78);
        font-size: 0.74rem;
        line-height: 1.2;
      }

      .bar-title {
        text-align: center;
      }

      .icon-button,
      .bar-action {
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .icon-button {
        font-size: 2.15rem;
        line-height: 1;
      }

      .bar-action {
        padding: 0 8px;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .icon-button:hover,
      .bar-action:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .icon-button:active,
      .bar-action:active,
      .route-row:active,
      .stop-button:active,
      .feedback-button:active,
      .dialog-primary:active,
      .dialog-secondary:active {
        transform: translateY(1px);
      }

      .home-intro {
        padding: 24px 20px 14px;
      }

      .home-intro h1 {
        margin: 0;
        font-size: clamp(1.65rem, 6vw, 2.1rem);
        font-weight: 760;
        letter-spacing: -0.035em;
        line-height: 1.15;
        text-wrap: balance;
      }

      .home-intro p {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .search-area {
        padding: 0 18px 14px;
      }

      .route-search {
        position: relative;
      }

      .route-search label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .route-search input {
        width: 100%;
        min-height: 44px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--surface-muted);
        color: var(--ink);
      }

      .route-search input::placeholder {
        color: var(--muted);
      }

      .home-tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }

      .home-tab {
        min-height: 46px;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
      }

      .home-tab:hover {
        color: var(--ink);
      }

      .home-tab[aria-selected="true"] {
        border-bottom-color: var(--accent);
        color: var(--accent-strong);
      }

      .location-mark {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--positive);
        box-shadow: 0 0 0 4px
          color-mix(in srgb, var(--positive) 16%, transparent);
      }

      .section-label {
        margin: 0;
        padding: 12px 20px 8px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .route-list {
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
        list-style: none;
      }

      .route-list li {
        border-bottom: 1px solid var(--line);
      }

      .route-row {
        display: grid;
        width: 100%;
        min-height: 112px;
        grid-template-columns: 54px minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        border: 0;
        background: var(--surface);
        text-align: left;
        cursor: pointer;
        transition:
          background-color 140ms ease,
          transform 80ms ease;
      }

      .route-row:hover {
        background: var(--surface-muted);
      }

      .route-row[aria-disabled="true"] {
        cursor: default;
      }

      .route-number {
        display: flex;
        width: 50px;
        height: 50px;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--accent);
        border-radius: 12px;
        color: var(--accent-strong);
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .route-copy {
        min-width: 0;
      }

      .route-copy strong {
        display: block;
        overflow: hidden;
        font-size: 1.13rem;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .route-copy span {
        display: block;
        overflow: hidden;
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .route-eta {
        min-width: 76px;
        text-align: right;
      }

      .route-eta strong {
        display: block;
        color: var(--accent-strong);
        font-size: 1.9rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .route-eta span {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .route-eta .service-later {
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.25;
      }

      .home-note {
        margin: 18px 20px calc(30px + env(safe-area-inset-bottom));
        padding: 14px 15px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-muted);
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.55;
      }

      .search-empty {
        margin: 24px 18px;
        padding: 24px 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-muted);
        text-align: center;
      }

      .search-empty strong,
      .search-empty span {
        display: block;
      }

      .search-empty span {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .map-shell {
        position: relative;
        height: clamp(190px, 33dvh, 270px);
        overflow: hidden;
        border-bottom: 1px solid var(--line);
        background: #dce5df;
      }

      .map-shell iframe {
        width: 100%;
        height: 100%;
        border: 0;
        filter: saturate(0.72) contrast(0.94);
      }

      .map-caption {
        position: absolute;
        right: 12px;
        bottom: 12px;
        max-width: calc(100% - 24px);
        padding: 8px 10px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        box-shadow: 0 2px 10px rgba(20, 24, 28, 0.16);
        color: var(--ink);
        font-size: 0.75rem;
        font-weight: 700;
        backdrop-filter: blur(10px);
      }

      .route-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .route-summary div {
        min-width: 0;
        padding: 13px 10px;
        text-align: center;
      }

      .route-summary div + div {
        border-left: 1px solid var(--line);
      }

      .route-summary strong,
      .route-summary span {
        display: block;
      }

      .route-summary strong {
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }

      .route-summary span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.68rem;
      }

      .stop-list-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 18px 10px;
      }

      .stop-list-heading h1 {
        margin: 0;
        font-size: 1rem;
      }

      .stop-list-heading span {
        color: var(--muted);
        font-size: 0.72rem;
      }

      .stop-list {
        margin: 0;
        padding: 0 0 18px;
        list-style: none;
      }

      .stop-item {
        position: relative;
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
      }

      .stop-rail {
        position: relative;
        display: flex;
        justify-content: center;
      }

      .stop-rail::before {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--accent-line);
        content: "";
      }

      .stop-item:first-child .stop-rail::before {
        top: 28px;
      }

      .stop-item:last-child .stop-rail::before {
        bottom: calc(100% - 30px);
      }

      .stop-dot {
        position: relative;
        z-index: 1;
        width: 16px;
        height: 16px;
        margin-top: 22px;
        border: 3px solid var(--surface);
        border-radius: 50%;
        background: var(--accent-line);
        box-shadow: 0 0 0 2px var(--accent-line);
      }

      .stop-item.active .stop-dot {
        width: 20px;
        height: 20px;
        margin-top: 20px;
        background: var(--accent);
        box-shadow:
          0 0 0 2px var(--accent),
          0 0 0 7px var(--accent-soft);
      }

      .stop-content {
        min-width: 0;
        border-bottom: 1px solid var(--line);
      }

      .stop-button {
        display: grid;
        width: 100%;
        min-height: 62px;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 13px 18px 13px 0;
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .stop-button:hover {
        color: var(--accent-strong);
      }

      .stop-name {
        min-width: 0;
      }

      .stop-name strong {
        display: block;
        overflow: hidden;
        font-size: 0.98rem;
        font-weight: 690;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stop-name small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.7rem;
      }

      .stop-hint {
        color: var(--muted);
        font-size: 0.76rem;
      }

      .stop-item.active .stop-hint {
        color: var(--accent-strong);
        font-weight: 700;
      }

      .stop-arrivals {
        padding: 3px 18px 18px 0;
      }

      .arrival-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .arrival-time {
        min-width: 0;
        padding: 11px 6px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-muted);
        text-align: center;
      }

      .arrival-time strong,
      .arrival-time span,
      .arrival-time time {
        display: block;
      }

      .arrival-time strong {
        color: var(--accent-strong);
        font-size: 1.25rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
      }

      .arrival-time span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.66rem;
      }

      .arrival-time time {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.7rem;
        font-variant-numeric: tabular-nums;
      }

      .feedback-prompt {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      .feedback-prompt p {
        margin: 0;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.35;
      }

      .feedback-button {
        flex: 0 0 auto;
        min-height: 42px;
        padding: 0 14px;
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: transparent;
        color: var(--accent-strong);
        font-size: 0.8rem;
        font-weight: 750;
        cursor: pointer;
      }

      .feedback-button:hover {
        background: var(--accent-soft);
      }

      /* Route-detail UI prototype: three structural variants via ?variant=. */
      #route-screen {
        padding-bottom: 0;
      }

      .route-view {
        min-height: calc(100dvh - 64px);
        background: var(--surface);
      }

      .route-service-line {
        display: flex;
        min-height: 42px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font-size: 0.76rem;
      }

      .route-service-line strong {
        color: var(--ink);
        font-size: 0.8rem;
      }

      .estimate-label {
        color: var(--accent-strong);
        font-weight: 750;
      }

      .map-panel {
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid var(--line);
        background: #d9e0dc;
      }

      .route-map {
        width: 100%;
        height: 250px;
      }

      .map-panel.compact .route-map {
        height: 220px;
      }

      .map-panel.map-first .route-map {
        height: clamp(300px, 47dvh, 410px);
      }

      .map-toolbar {
        position: absolute;
        z-index: 2;
        top: 10px;
        right: 10px;
        display: flex;
        gap: 6px;
      }

      .map-tool,
      .map-reopen {
        min-height: 44px;
        padding: 0 11px;
        border: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
        border-radius: 10px;
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        box-shadow: 0 2px 9px rgba(20, 24, 28, 0.13);
        color: var(--ink);
        font-size: 0.76rem;
        font-weight: 720;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }

      .map-tool:active,
      .map-reopen:active {
        transform: translateY(1px);
      }

      .map-tool[aria-pressed="true"] {
        border-color: var(--accent-line);
        background: var(--accent);
        color: #fffafc;
      }

      .map-tool.icon-only {
        display: grid;
        width: 44px;
        padding: 0;
        place-items: center;
      }

      .locate-icon {
        position: relative;
        width: 24px;
        height: 24px;
        background:
          linear-gradient(currentColor, currentColor) center / 2px 100%
            no-repeat,
          linear-gradient(currentColor, currentColor) center / 100% 2px
            no-repeat;
      }

      .locate-icon::before {
        position: absolute;
        inset: 4px;
        border: 2px solid currentColor;
        border-radius: 50%;
        background: var(--surface);
        content: "";
      }

      .map-tool[aria-pressed="true"] .locate-icon::before {
        background: var(--accent);
      }

      .locate-icon::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        content: "";
        transform: translate(-50%, -50%);
      }

      .map-reopen {
        display: block;
        width: calc(100% - 32px);
        margin: 10px 16px;
        box-shadow: none;
      }

      .map-route-label {
        position: absolute;
        z-index: 2;
        top: 10px;
        left: 10px;
        max-width: calc(100% - 20px);
        padding: 6px 8px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        color: var(--muted);
        font-size: 0.67rem;
        font-weight: 650;
        backdrop-filter: blur(8px);
      }

      .map-unavailable {
        display: grid;
        height: 100%;
        place-items: center;
        padding: 24px;
        color: #47534d;
        font-size: 0.78rem;
        text-align: center;
      }

      .maplibregl-ctrl-attrib {
        font-size: 9px;
      }

      .maplibregl-ctrl-bottom-right {
        bottom: 112px;
      }

      .map-stop-marker {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        pointer-events: none;
      }

      .map-stop-button {
        position: relative;
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #fffafc;
        font-size: 0.64rem;
        font-weight: 800;
        cursor: pointer;
        pointer-events: auto;
      }

      .map-stop-button::before {
        position: absolute;
        width: 26px;
        height: 26px;
        border: 2px solid var(--surface);
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 1px 5px rgba(22, 18, 25, 0.3);
        content: "";
        transition:
          width 140ms ease,
          height 140ms ease,
          box-shadow 140ms ease;
      }

      .map-stop-marker.selected .map-stop-button::before {
        width: 34px;
        height: 34px;
        box-shadow:
          0 0 0 5px color-mix(in srgb, var(--accent) 24%, transparent),
          0 2px 8px rgba(22, 18, 25, 0.3);
      }

      .map-stop-marker.conditional .map-stop-button::before {
        border: 2px dashed var(--accent);
        background: var(--surface);
      }

      .map-stop-marker.conditional .map-stop-number {
        color: var(--accent-strong);
      }

      .map-stop-number {
        position: relative;
        z-index: 1;
      }

      .user-location-marker {
        width: 17px;
        height: 17px;
        border: 3px solid var(--surface);
        border-radius: 50%;
        background: #1677d2;
        box-shadow:
          0 0 0 6px rgba(22, 119, 210, 0.2),
          0 1px 5px rgba(22, 18, 25, 0.3);
      }

      .nearest-strip {
        display: flex;
        min-height: 48px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--accent-soft);
      }

      .nearest-strip span,
      .nearest-strip strong {
        display: block;
      }

      .nearest-strip span {
        color: var(--muted);
        font-size: 0.72rem;
      }

      .nearest-strip strong {
        margin-top: 2px;
        color: var(--accent-strong);
        font-size: 0.9rem;
      }

      .nearest-strip button {
        min-height: 44px;
        padding: 0 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--accent-strong);
        font-size: 0.75rem;
        font-weight: 750;
        cursor: pointer;
      }

      .journey-heading {
        margin: 0;
        padding: 16px 18px 8px;
        font-size: 0.82rem;
        font-weight: 750;
      }

      .variant-a .journey-scroll {
        height: max(190px, calc(100dvh - 64px - 42px - 216px - 48px - 64px));
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }

      .variant-a.map-closed .journey-scroll {
        height: max(280px, calc(100dvh - 64px - 42px - 59px - 48px - 64px));
      }

      .journey-list,
      .plain-stop-list {
        margin: 0;
        padding: 0 0 10px;
        list-style: none;
      }

      .journey-stop {
        position: relative;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
      }

      .journey-rail {
        position: relative;
        display: flex;
        justify-content: center;
      }

      .journey-rail::before {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: color-mix(in srgb, var(--accent-line) 72%, var(--line));
        content: "";
      }

      .journey-stop:first-child .journey-rail::before {
        top: 25px;
      }

      .journey-stop:last-child .journey-rail::before {
        bottom: calc(100% - 25px);
      }

      .journey-dot {
        position: relative;
        z-index: 1;
        width: 12px;
        height: 12px;
        margin-top: 20px;
        border: 3px solid var(--surface);
        border-radius: 50%;
        background: var(--accent-line);
        box-shadow: 0 0 0 1px var(--accent-line);
      }

      .journey-stop.active .journey-dot {
        width: 16px;
        height: 16px;
        margin-top: 18px;
        background: var(--accent);
        box-shadow:
          0 0 0 2px var(--accent),
          0 0 0 5px var(--accent-soft);
      }

      .journey-content {
        min-width: 0;
        border-bottom: 1px solid var(--line);
      }

      .journey-stop:last-child .journey-content {
        border-bottom: 0;
      }

      .journey-select,
      .plain-stop-button {
        display: grid;
        width: 100%;
        min-height: 54px;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding: 9px 18px 9px 0;
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .journey-select:hover,
      .plain-stop-button:hover {
        color: var(--accent-strong);
      }

      .journey-name strong,
      .journey-name small {
        display: block;
      }

      .journey-name strong {
        overflow: hidden;
        font-size: 0.9rem;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .journey-name small {
        overflow: hidden;
        margin-top: 2px;
        color: var(--muted);
        font-size: 0.72rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stop-badge {
        color: var(--muted);
        font-size: 0.68rem;
        white-space: nowrap;
      }

      .stop-badge.nearby {
        color: var(--accent-strong);
        font-weight: 750;
      }

      .inline-arrivals {
        padding: 2px 18px 15px 0;
      }

      .next-arrival {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .next-arrival strong {
        color: var(--accent-strong);
        font-size: 1.8rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .next-arrival strong small {
        margin-left: 3px;
        font-size: 0.8rem;
        letter-spacing: 0;
      }

      .next-arrival time {
        color: var(--muted);
        font-size: 0.76rem;
        font-variant-numeric: tabular-nums;
      }

      .later-arrivals {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 0.73rem;
        font-variant-numeric: tabular-nums;
        line-height: 1.45;
      }

      .feedback-link {
        min-height: 44px;
        margin: 6px 0 0 -8px;
        padding: 0 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--accent-strong);
        font-size: 0.73rem;
        font-weight: 750;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .feedback-link:hover {
        background: var(--accent-soft);
      }

      .eta-hero {
        padding: 18px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .eta-hero-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .eta-hero h1 {
        margin: 0;
        font-size: 1.28rem;
        letter-spacing: -0.025em;
      }

      .eta-hero h1 small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0;
      }

      .nearby-tag {
        flex: 0 0 auto;
        color: var(--accent-strong);
        font-size: 0.7rem;
        font-weight: 750;
      }

      .eta-hero-main {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-top: 17px;
      }

      .eta-hero-number {
        color: var(--accent-strong);
        font-size: clamp(3.1rem, 15vw, 4.8rem);
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        letter-spacing: -0.075em;
        line-height: 0.85;
      }

      .eta-hero-number small {
        margin-left: 5px;
        font-size: 0.9rem;
        letter-spacing: 0;
      }

      .eta-hero-time {
        color: var(--muted);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .eta-hero-time strong {
        display: block;
        margin-bottom: 3px;
        color: var(--ink);
        font-size: 1rem;
      }

      .eta-hero-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 15px;
        padding-top: 11px;
        border-top: 1px solid var(--line);
      }

      .eta-hero-footer p {
        margin: 0;
        color: var(--muted);
        font-size: 0.73rem;
        line-height: 1.4;
      }

      .eta-hero-footer .feedback-link {
        flex: 0 0 auto;
        margin: 0;
      }

      .plain-list-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px 8px;
      }

      .plain-list-heading h2 {
        margin: 0;
        font-size: 0.86rem;
      }

      .plain-list-heading span {
        color: var(--muted);
        font-size: 0.67rem;
      }

      .plain-stop-list {
        padding: 0 18px 12px;
      }

      .plain-stop-list li {
        border-bottom: 1px solid var(--line);
      }

      .plain-stop-list li:last-child {
        border-bottom: 0;
      }

      .plain-stop-button {
        min-height: 52px;
        padding: 8px 0;
      }

      .plain-stop-list li.active .plain-stop-button {
        color: var(--accent-strong);
      }

      .stop-index {
        display: inline-block;
        min-width: 23px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }

      .plain-stop-eta {
        color: var(--muted);
        font-size: 0.7rem;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .plain-stop-eta strong {
        display: block;
        color: var(--accent-strong);
        font-size: 0.82rem;
      }

      .map-selected-card {
        position: absolute;
        z-index: 2;
        right: 12px;
        bottom: 12px;
        left: 12px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
        border-radius: 12px;
        background: color-mix(in srgb, var(--surface) 96%, transparent);
        box-shadow: 0 7px 22px rgba(20, 24, 28, 0.18);
        backdrop-filter: blur(10px);
      }

      .map-selected-card[hidden] {
        display: none;
      }

      .map-selected-card strong,
      .map-selected-card span,
      .map-selected-card small {
        display: block;
      }

      .map-selected-card strong {
        font-size: 0.94rem;
      }

      .map-selected-card small {
        margin-top: 2px;
        color: var(--muted);
        font-size: 0.65rem;
      }

      .map-selected-card span {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.7rem;
        font-variant-numeric: tabular-nums;
      }

      .map-selected-eta {
        color: var(--accent-strong);
        font-size: 1.75rem;
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        text-align: right;
      }

      .map-selected-eta small {
        margin-top: 4px;
        font-size: 0.66rem;
        letter-spacing: 0;
      }

      .map-selected-actions {
        display: flex;
        grid-column: 1 / -1;
        justify-content: flex-end;
        gap: 6px;
        padding-top: 1px;
      }

      .map-card-action {
        min-height: 38px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--accent-strong);
        font-size: 0.7rem;
        font-weight: 750;
        cursor: pointer;
      }

      .map-card-action:hover {
        background: var(--accent-soft);
      }

      .variant-c > .inline-arrivals {
        padding: 0 18px 20px;
      }

      .prototype-switcher {
        position: fixed;
        z-index: 50;
        right: 0;
        bottom: calc(12px + env(safe-area-inset-bottom));
        left: 0;
        display: grid;
        width: min(calc(100% - 24px), 360px);
        grid-template-columns: 46px minmax(0, 1fr) 46px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--surface) 20%, transparent);
        border-radius: 13px;
        background: color-mix(in srgb, var(--ink) 94%, transparent);
        box-shadow: 0 10px 28px rgba(8, 10, 13, 0.28);
        color: var(--surface);
        backdrop-filter: blur(10px);
      }

      .prototype-switcher[hidden] {
        display: none;
      }

      .prototype-switcher button {
        min-height: 48px;
        padding: 0 10px;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .prototype-switcher button:first-child {
        border-right: 1px solid
          color-mix(in srgb, var(--surface) 18%, transparent);
        font-size: 1.6rem;
      }

      .prototype-switcher button:last-child {
        border-left: 1px solid
          color-mix(in srgb, var(--surface) 18%, transparent);
        font-size: 1.6rem;
      }

      #variant-label {
        overflow: hidden;
        font-size: 0.75rem;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .prototype-switcher button:hover {
        background: color-mix(in srgb, var(--surface) 12%, transparent);
      }

      .prototype-switcher button:active {
        transform: translateY(1px);
      }

      @media (max-width: 370px) {
        .route-service-line,
        .nearest-strip,
        .eta-hero,
        .plain-stop-list {
          padding-right: 14px;
          padding-left: 14px;
        }

        .eta-hero-footer {
          align-items: flex-start;
          flex-direction: column;
        }

        .map-panel.map-first .route-map {
          height: 330px;
        }
      }

      .method-details {
        margin: 0 18px calc(30px + env(safe-area-inset-bottom));
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-muted);
      }

      .method-details summary {
        padding: 14px 15px;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
      }

      .method-details div {
        padding: 0 15px 15px;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.6;
      }

      .method-details p {
        margin: 0 0 8px;
      }

      .method-details a {
        color: var(--accent-strong);
      }

      dialog {
        width: min(500px, calc(100% - 24px));
        max-height: calc(100dvh - 24px);
        margin: auto auto 0;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius) var(--radius) 0 0;
        background: var(--surface);
        color: var(--ink);
      }

      dialog::backdrop {
        background: rgba(8, 10, 13, 0.55);
        backdrop-filter: blur(2px);
      }

      .dialog-form {
        max-height: calc(100dvh - 24px);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 22px 20px calc(20px + env(safe-area-inset-bottom));
      }

      .dialog-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .dialog-header h2 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }

      .dialog-header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .dialog-close {
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: var(--surface-muted);
        cursor: pointer;
      }

      .dialog-close:disabled,
      .dialog-primary:disabled,
      .dialog-secondary:disabled,
      .feedback-time-step:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      .feedback-context {
        display: grid;
        gap: 7px;
        margin: 18px 2px 14px;
      }

      .feedback-context div {
        display: grid;
        grid-template-columns: 62px minmax(0, 1fr);
        align-items: baseline;
        gap: 12px;
      }

      .feedback-context dt,
      .feedback-context dd {
        margin: 0;
      }

      .feedback-context dt {
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 650;
      }

      .feedback-context dd {
        font-size: 0.88rem;
        font-weight: 760;
      }

      .feedback-time-card {
        display: grid;
        min-height: 106px;
        grid-template-columns: minmax(0, 1fr) 44px;
        align-items: center;
        gap: 14px;
        padding: 6px 12px 6px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(
          in srgb,
          var(--surface-muted) 72%,
          var(--surface)
        );
      }

      .feedback-time-copy {
        min-width: 0;
      }

      .feedback-time-label,
      .feedback-time-relative {
        display: block;
      }

      .feedback-time-label {
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 680;
      }

      #feedback-current-time {
        display: inline-block;
        margin-top: 2px;
        color: var(--accent-strong);
        font-size: 1.78rem;
        font-variant-numeric: tabular-nums;
        font-weight: 790;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .feedback-time-relative {
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.7rem;
      }

      .feedback-time-stepper {
        display: grid;
        grid-template-rows: repeat(2, 44px);
        gap: 4px;
      }

      .feedback-time-step {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        color: var(--accent-strong);
        font-size: 1.18rem;
        font-weight: 780;
        line-height: 1;
        cursor: pointer;
      }

      .feedback-time-step:hover:not(:disabled) {
        border-color: var(--accent-line);
        background: var(--accent-hover);
      }

      .feedback-time-step:active:not(:disabled) {
        transform: translateY(1px);
      }

      .feedback-time-step:disabled {
        cursor: not-allowed;
        opacity: 0.3;
      }

      .feedback-privacy,
      .feedback-error {
        margin: 12px 2px;
        font-size: 0.72rem;
        line-height: 1.45;
      }

      .feedback-privacy {
        color: var(--muted);
      }

      .feedback-error {
        padding: 9px 11px;
        border-radius: 9px;
        background: color-mix(in srgb, var(--danger) 10%, transparent);
        color: var(--danger);
        font-weight: 680;
      }

      /* Prototype-only review aids are not part of the passenger experience. */
      .method-details,
      .prototype-switcher {
        display: none !important;
      }

      .dialog-actions {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 10px;
      }

      .dialog-primary,
      .dialog-secondary {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 14px;
        border-radius: 10px;
        font-weight: 750;
        cursor: pointer;
      }

      .dialog-primary {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fffafc;
      }

      .dialog-primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, #000);
      }

      .dialog-secondary {
        border: 1px solid var(--line);
        background: var(--surface);
      }

      .dialog-secondary:hover {
        background: var(--surface-muted);
      }

      .button-spinner {
        display: none;
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 250, 252, 0.38);
        border-top-color: #fffafc;
        border-radius: 50%;
        animation: feedback-spin 700ms linear infinite;
      }

      .dialog-primary.is-loading .button-spinner {
        display: inline-block;
      }

      .feedback-error[hidden],
      .feedback-entry[hidden] {
        display: none;
      }

      .toast {
        position: fixed;
        z-index: 40;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
        left: 16px;
        max-width: 500px;
        margin: 0 auto;
        padding: 13px 15px;
        border-radius: 12px;
        background: var(--ink);
        box-shadow: 0 10px 28px rgba(8, 10, 13, 0.24);
        color: var(--surface);
        font-size: 0.82rem;
        line-height: 1.45;
        opacity: 0;
        pointer-events: none;
        transform: translateY(14px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .loading-list {
        padding: 18px;
      }

      .skeleton {
        height: 88px;
        margin-bottom: 10px;
        border-radius: 12px;
        background: linear-gradient(
          90deg,
          var(--surface-muted),
          var(--surface-strong),
          var(--surface-muted)
        );
        background-size: 220% 100%;
        animation: shimmer 1.4s infinite linear;
      }

      .state-card {
        margin: 24px 18px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-muted);
      }

      .state-card h1 {
        margin: 0;
        font-size: 1.15rem;
      }

      .state-card p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
      }

      @keyframes shimmer {
        to {
          background-position: -220% 0;
        }
      }

      @keyframes feedback-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (min-width: 561px) {
        .app {
          margin-block: 18px;
          min-height: calc(100dvh - 36px);
          border-radius: 18px;
        }

        .app-bar {
          border-radius: 18px 18px 0 0;
        }

        dialog {
          margin: auto;
          border-radius: var(--radius);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /*
       * Interaction pass: optimise for the three-second "where and when" scan.
       * Nearby road-side stops remain separate choices; selecting a route then
       * expands its ETA inside the stop list, following familiar HK bus apps.
       */
      .app {
        width: min(100%, 500px);
      }

      .app-bar {
        min-height: calc(58px + env(safe-area-inset-top));
        padding-bottom: 8px;
      }

      .app-bar.home-bar {
        grid-template-columns: minmax(0, 1fr);
      }

      .app-brand small,
      .bar-title small {
        margin-top: 1px;
      }

      .home-dashboard {
        padding: 18px 16px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .nearby-kicker,
      .nearby-station-name,
      .nearby-station-meta {
        display: block;
      }

      .nearby-kicker {
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
      }

      .nearby-station-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-top: 5px;
      }

      .nearby-station-name {
        font-size: 1.35rem;
        font-weight: 790;
        letter-spacing: -0.035em;
        line-height: 1.2;
      }

      .nearby-station-meta {
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.45;
      }

      .gps-label {
        flex: 0 0 auto;
        padding-top: 3px;
        color: var(--positive);

      <section class="screen" id="home-screen" aria-labelledby="home-title">
        <header class="app-bar home-bar">
          <div class="app-brand">
            <strong>CUpedia 校巴</strong>
            <small>今日班次與預計到站</small>
          </div>
        </header>

        <div id="home-content"></div>
      </section>

        class="screen"

        hidden
      >

            class="icon-button"
            id="back-button"
            type="button"
            aria-label="返回路線列表"
          >

            <strong id="route-title" tabindex="-1">2 新聯線</strong>
            <small>環線 · 經新亞、聯合往大學站</small>
          </div>
          <span aria-hidden="true"></span>
        </header>

        <div id="route-content"></div>
      </section>
    </main>

    <dialog id="feedback-dialog" aria-labelledby="feedback-title">
      <form
        class="dialog-form"
        id="feedback-form"
        method="dialog"
        autocomplete="off"
      >
        <div class="dialog-header">
          <h2 id="feedback-title">提交到站時間</h2>
          <button
            class="dialog-close"
            id="dialog-close"
            type="button"
            aria-label="關閉"
          >
            ✕
          </button>
        </div>

        <div class="feedback-entry" id="feedback-entry">
          <dl class="feedback-context">
            <div>
              <dt>路線</dt>
              <dd>2 新聯線</dd>
            </div>
            <div>
              <dt>站點</dt>
              <dd id="feedback-station">善衡書院</dd>
            </div>
          </dl>

          <div class="feedback-time-card">
            <div class="feedback-time-copy">
              <span class="feedback-time-label" id="feedback-time-label"
                >到站時間</span
              >
              <time id="feedback-current-time" datetime="">08:05</time>
              <span class="feedback-time-relative" id="feedback-time-relative"
                >現在</span
              >
            </div>
            <div
              class="feedback-time-stepper"
              role="group"
              aria-label="調整到站分鐘"
            >
              <button
                class="feedback-time-step"
                id="feedback-time-later"
                type="button"
                aria-label="到站時間調後一分鐘"
              >
                <span aria-hidden="true">+</span>
              </button>
              <button
                class="feedback-time-step"
                id="feedback-time-earlier"
                type="button"
                aria-label="到站時間調前一分鐘"
              >
                <span aria-hidden="true">−</span>
              </button>
            </div>
          </div>

          <p class="feedback-privacy">匿名提交，只用於改善預計到站時間。</p>
          <p class="feedback-error" id="feedback-error" role="alert" hidden>
            未能提交，請檢查網絡後重試。
          </p>

          <div class="dialog-actions">
            <button class="dialog-secondary" id="cancel-feedback" type="button">
              取消
            </button>
            <button class="dialog-primary" id="feedback-submit" type="submit">
              <span class="button-spinner" aria-hidden="true"></span>
              <span id="feedback-submit-label">提交</span>
            </button>
          </div>
        </div>
      </form>
    </dialog>

      function timeToMinutes(value) {
        const [hours, minutes] = value.split(":").map(Number);
        return hours * 60 + minutes;
      }

      function minutesToTime(total) {
        const normalized = ((total % 1440) + 1440) % 1440;
        const hours = Math.floor(normalized / 60);
        const minutes = normalized % 60;
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
      }

      function tripServesStop(departure, stop) {
        if (!stop.departureMinuteWindow) return true;
        const minute = departure % 60;
        const { from, to } = stop.departureMinuteWindow;
        return from <= to
          ? minute >= from && minute <= to
          : minute >= from || minute <= to;
      }

      function scheduledDepartures() {
        const departures = [];
        for (
          let minute = timeToMinutes("07:45");
          minute <= timeToMinutes("18:45");
          minute += 15
        ) {
          departures.push(minute);
        }
        return departures;
      }

      function serviceWindowForStop(stop) {
        const stoppingDepartures = scheduledDepartures().filter((departure) =>
          tripServesStop(departure, stop),
        );
        if (!stoppingDepartures.length) return null;
        return {
          firstArrival: stoppingDepartures[0] + stop.offset,
          lastArrival:
            stoppingDepartures[stoppingDepartures.length - 1] + stop.offset,
        };
      }

      function upcomingTripCandidates(stop) {
        const now = timeToMinutes(currentAppTime());
        const serviceWindow = serviceWindowForStop(stop);
        if (
          !serviceWindow ||
          now < serviceWindow.firstArrival ||
          now > serviceWindow.lastArrival
        ) {
          return [];
        }
        return scheduledDepartures()
          .map((departure) => {
            const plannedArrival = departure + stop.offset;
            const servesStop = tripServesStop(departure, stop);
            return {
              departureTime: minutesToTime(departure),
              plannedArrival,
              servesStop,
              time: servesStop ? minutesToTime(plannedArrival) : null,
              wait: servesStop ? plannedArrival - now : null,
            };
          })
          .filter((trip) => trip.plannedArrival >= now);
      }

      function upcomingTrips(stop) {
        return upcomingTripCandidates(stop)
          .filter((trip) => trip.servesStop)
          .slice(0, 3)
          .map(({ plannedArrival, ...trip }) => trip);
      }

      function upcomingSkippedTrips(stop) {
        return upcomingTripCandidates(stop)
          .filter((trip) => !trip.servesStop)
          .slice(0, 2)
          .map(({ plannedArrival, ...trip }) => trip);
      }

      function arrivalStatusForStop(stop) {
        const now = timeToMinutes(currentAppTime());
        const serviceWindow = serviceWindowForStop(stop);
        if (!serviceWindow) return "今日不經此站";
        if (now < serviceWindow.firstArrival) {
          return `首班預計 ${minutesToTime(serviceWindow.firstArrival)}`;
        }
        if (now > serviceWindow.lastArrival) return "今日服務已結束";
        return "暫無預計班次";
      }
