                return `
                  <li class="journey-stop ${selected ? "active" : ""}" data-stop-row="${stop.id}">
                    <div class="journey-rail" aria-hidden="true"><span class="journey-dot"></span></div>
                    <div class="journey-content">
                      <button
                        class="journey-select"
                        type="button"
                        data-stop-id="${stop.id}"
                        aria-expanded="${selected}"
                        ${selected ? `aria-controls="arrivals-${stop.id}"` : ""}
                      >
                        <span class="journey-name">
                          <strong>${index + 1}. ${stop.name}</strong>
                          <small>${stop.nameEn}</small>
                        </span>
                        <span class="stop-badge ${stop.id === state.nearbyStopId ? "nearby" : ""}">${badge}</span>
                      </button>
                      ${selected ? inlineArrivalsMarkup(stop) : ""}
                    </div>
                  </li>`;
              }).join("")}
            </ol>
          </div>`;
      }

      function etaHeroMarkup() {
        const stop = activeStop();
        const trips = upcomingTrips(stop);
        const [next, ...later] = trips.filter((trip) => trip.servesStop);
        if (!next) {
          return `
            <section class="eta-hero" aria-labelledby="selected-stop-title">
              <div class="eta-hero-head">
                <h1 id="selected-stop-title">
                  ${stop.name}
                  <small>${stop.nameEn}</small>
                </h1>
                <span class="nearby-tag">${stop.id === state.nearbyStopId ? "定位附近" : `第 ${STOPS.indexOf(stop) + 1} 站`}</span>
              </div>
              <div class="arrival-empty">${arrivalStatusForStop(stop)}</div>
              <div class="eta-hero-footer">
                <p>如巴士已到站，可提交實際時間。</p>
                <button class="feedback-link" type="button" data-feedback>
                  預測不準？提交即時到站時間改進預測
                </button>
              </div>
            </section>`;
        }
        return `
          <section class="eta-hero" aria-labelledby="selected-stop-title">
            <div class="eta-hero-head">
              <h1 id="selected-stop-title">
                ${stop.name}
                <small>${stop.nameEn}</small>
              </h1>
              <span class="nearby-tag">${stop.id === state.nearbyStopId ? "定位附近" : `第 ${STOPS.indexOf(stop) + 1} 站`}</span>
            </div>
            <div class="eta-hero-main">
              <div class="eta-hero-number">${next.wait}<small>分鐘</small></div>
              <div class="eta-hero-time">
                <strong>預計 ${next.time}</strong>
              </div>
            </div>
            <div class="eta-hero-footer">
              <p>${trips[0]?.servesStop === false ? "下一班不經此站" : later.length ? `之後 ${later.map((arrival) => `${arrival.wait} 分鐘`).join("、")}` : ""}</p>
              <button class="feedback-link" type="button" data-feedback>
                預測不準？提交即時到站時間改進預測
              </button>
            </div>
          </section>`;
      }

      function plainStopListMarkup(headingId) {
        return `
          <section aria-labelledby="${headingId}">
            <div class="plain-list-heading">
              <h2 id="${headingId}">全部站點</h2>
            </div>
            <ol class="plain-stop-list">
              ${STOPS.map((stop, index) => {
                const selected = stop.id === state.stopId;
                const next = upcomingTrips(stop).find(
                  (trip) => trip.servesStop,
                );
                return `
                  <li class="${selected ? "active" : ""}" data-stop-row="${stop.id}">
                    <button class="plain-stop-button" type="button" data-stop-id="${stop.id}" aria-pressed="${selected}">
                      <span class="journey-name">
                        <strong><span class="stop-index">${index + 1}</span>${stop.name}</strong>
                        <small>${stop.nameEn}${stop.conditional ? " · 部分班次" : ""}</small>
                      </span>
                      <span class="plain-stop-eta">
                        ${selected && next ? `<strong>${next.wait} 分鐘</strong>預計 ${next.time}` : selected ? arrivalStatusForStop(stop) : "查看"}
                      </span>
                    </button>
                  </li>`;
              }).join("")}
            </ol>
          </section>`;
      }

      function nearestStripMarkup() {
        const selectedNearbyStop = nearbyStop();
        const otherRoadStop = oppositeRoadStop();
        const showingNearby = state.stopId === state.nearbyStopId;
        return `
          <div class="nearest-strip">
            <div>
              <span>${showingNearby ? "GPS 推測候車站" : "你的附近候車站"}</span>
              <strong>${selectedNearbyStop.name}</strong>
            </div>
            <button type="button" ${showingNearby ? "data-switch-nearby" : "data-locate"}>
              ${showingNearby ? `馬路另一側：${otherRoadStop.name}` : "回到附近站點"}
            </button>
          </div>`;
      }

      function variantAMarkup() {
        return `
          <div class="route-view variant-a" data-variant="a">
            ${serviceLineMarkup()}
            ${mapMarkup()}
            ${journeyListMarkup()}
          </div>`;
      }

      function variantBMarkup() {
        return `
          <div class="route-view variant-b" data-variant="b">
            ${serviceLineMarkup()}
            ${etaHeroMarkup()}
            ${mapMarkup("compact")}
            ${plainStopListMarkup("stops-title-b")}
          </div>`;
      }

      function variantCMarkup() {
        return `
          <div class="route-view variant-c" data-variant="c">
            ${serviceLineMarkup()}
            ${mapMarkup("map-first")}
            ${nearestStripMarkup()}
            ${plainStopListMarkup("stops-title-c")}
            <div class="inline-arrivals">
              <button class="feedback-link" type="button" data-feedback>
                ${activeStop().name}：提交即時到站時間
              </button>
            </div>
          </div>`;
      }

      function destroyRouteMap() {
        routeMapMarkers.forEach((marker) => marker.remove());
        routeMapMarkers = [];
        routeMapMarkerElements.clear();
        if (routeMap) routeMap.remove();
        routeMap = null;
      }

      function routeBounds() {
        const bounds = new maplibregl.LngLatBounds();
        ROUTE_2_GEOMETRY.geometry.coordinates.forEach((line) => {
          line.forEach((coordinates) => bounds.extend(coordinates));
        });
        STOPS.forEach((stop) => bounds.extend(stop.coordinates));
        return bounds;
      }

      function nearbyBounds() {
        const bounds = new maplibregl.LngLatBounds();
        bounds.extend(nearbyStop().coordinates);
        bounds.extend(oppositeRoadStop().coordinates);
        bounds.extend(SAMPLE_USER_LOCATION);
        return bounds;
      }

      function updateMapModeControls() {
        document.querySelectorAll("[data-locate]").forEach((button) => {
          button.setAttribute("aria-pressed", state.mapMode === "user");
        });
      }

      function applyMapCamera(animate = true) {
        if (!routeMap) return;
        routeMap.resize();
        const duration = animate ? 320 : 0;
        const bottomPadding = state.variant === "a" ? 48 : 132;
        if (state.mapMode === "overview") {
          routeMap.fitBounds(routeBounds(), {
            padding: { top: 64, right: 34, bottom: bottomPadding, left: 34 },
            duration,
            maxZoom: 15.7,
          });
        } else if (state.mapMode === "nearby") {
          routeMap.fitBounds(nearbyBounds(), {
            padding: { top: 64, right: 40, bottom: bottomPadding, left: 40 },
            duration,
            maxZoom: 17.5,
          });
        } else if (state.mapMode === "user") {
          routeMap.easeTo({
            center: SAMPLE_USER_LOCATION,
            zoom: 17.5,
            offset: [0, -30],
            duration,
          });
        } else if (state.mapMode === "selected") {
          routeMap.easeTo({
            center: activeStop().coordinates,
            zoom: Math.max(routeMap.getZoom(), 16.8),
            offset: [0, state.variant === "a" ? 0 : -38],
            duration,
          });
        }
        updateMapModeControls();
      }

      function markMapFree(event) {
        if (event?.originalEvent === undefined && event?.type === "zoomstart") {
          return;
        }
        state.mapMode = "free";
        updateMapModeControls();
        syncUrl(false);
      }

      function updateMapSelection() {
        routeMapMarkerElements.forEach((element, stopId) => {
          const selected = stopId === state.stopId;
          element.classList.toggle("selected", selected);
          element
            .querySelector("button")
            ?.setAttribute("aria-pressed", selected);
        });
        const card = document.querySelector("#map-selected-card");
        if (card) card.outerHTML = mapSelectedCardMarkup();
        const mapLabel = document.querySelector(".map-route-label small");
        if (mapLabel) mapLabel.textContent = routeContextForStop(activeStop());
      }

      function initRouteMap() {
        const container = document.querySelector("#route-map");
        if (!container || !state.mapOpen) return;

        if (!window.maplibregl) {
          container.innerHTML = `
            <p class="map-unavailable">
              地圖元件未能載入。站點列表仍可正常使用。
            </p>`;
          return;
        }

        const map = new maplibregl.Map({
          container,
          attributionControl: true,
          cooperativeGestures: true,
          dragRotate: false,
          touchPitch: false,
          locale: {
            "CooperativeGesturesHandler.WindowsHelpText":
              "按住 Ctrl 並捲動以縮放地圖",
            "CooperativeGesturesHandler.MacHelpText":
              "按住 Command 並捲動以縮放地圖",
            "CooperativeGesturesHandler.MobileHelpText": "使用雙指移動地圖",
          },
          style: {
            version: 8,
            sources: {
              osm: {
                type: "raster",
                tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
                tileSize: 256,
                attribution:
                  '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
              },
            },
            layers: [{ id: "osm", type: "raster", source: "osm" }],
          },
          center: activeStop().coordinates,
          zoom: 14.5,
          maxZoom: 18,
        });
        routeMap = map;

        map.on("load", () => {
          if (routeMap !== map) return;
          const accent = getComputedStyle(document.documentElement)
            .getPropertyValue("--accent")
            .trim();
          map.addSource("route-2-shape", {
            type: "geojson",
            data: ROUTE_2_GEOMETRY,
          });
          map.addLayer({
            id: "route-2-casing",
            type: "line",
            source: "route-2-shape",
            layout: { "line-cap": "round", "line-join": "round" },
            paint: {
              "line-color": "#fff",
              "line-width": 8,
              "line-opacity": 0.86,
            },
          });
          map.addLayer({
            id: "route-2-line",
            type: "line",
            source: "route-2-shape",
            layout: { "line-cap": "round", "line-join": "round" },
            paint: {
              "line-color": accent || "#55286f",
              "line-width": 5,
              "line-opacity": 0.9,
            },
          });
          requestAnimationFrame(() => applyMapCamera(false));
        });

        map.on("dragstart", markMapFree);
        map.on("zoomstart", markMapFree);

        STOPS.forEach((stop, index) => {
          const element = document.createElement("div");
          element.className = `map-stop-marker ${stop.id === state.stopId ? "selected" : ""} ${stop.conditional ? "conditional" : ""}`;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "map-stop-button";
          button.innerHTML = `<span class="map-stop-number">${index + 1}</span>`;
          button.setAttribute(
            "aria-label",
            `選擇第 ${index + 1} 站 ${stop.name}${stop.conditional ? "，部分班次停靠" : ""}`,
          );
          button.setAttribute("aria-pressed", stop.id === state.stopId);
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            selectStop(stop.id, "map");
          });
          element.append(button);
          routeMapMarkerElements.set(stop.id, element);
          routeMapMarkers.push(
            new maplibregl.Marker({ element, anchor: "center" })
              .setLngLat(stop.coordinates)
              .addTo(map),
          );
        });

        const userElement = document.createElement("div");
        userElement.className = "user-location-marker";
        userElement.setAttribute("aria-label", "模擬的目前位置");
        routeMapMarkers.push(
          new maplibregl.Marker({ element: userElement, anchor: "center" })
            .setLngLat(SAMPLE_USER_LOCATION)
            .addTo(map),
        );
      }

      function updateRouteSelection() {
        if (state.variant === "a") {
          document.querySelectorAll(".journey-stop").forEach((row) => {
            const stopId = row.dataset.stopRow;
            const selected = stopId === state.stopId;
            const stop = STOPS.find((item) => item.id === stopId);
            const button = row.querySelector("[data-stop-id]");
            const content = row.querySelector(".journey-content");
            row.classList.toggle("active", selected);
            button?.setAttribute("aria-expanded", selected);
            if (selected)
              button?.setAttribute("aria-controls", `arrivals-${stopId}`);
            else button?.removeAttribute("aria-controls");
            content?.querySelector(".inline-arrivals")?.remove();
            if (selected && content && stop) {
              content.insertAdjacentHTML(
                "beforeend",
                inlineArrivalsMarkup(stop),
              );
            }
          });
        } else if (state.variant === "b") {
          const hero = document.querySelector(".variant-b .eta-hero");
          const list = document.querySelector(
            '.variant-b section[aria-labelledby="stops-title-b"]',
          );
          if (hero) hero.outerHTML = etaHeroMarkup();
          if (list) list.outerHTML = plainStopListMarkup("stops-title-b");
        } else {
          const strip = document.querySelector(".variant-c .nearest-strip");
          const list = document.querySelector(
            '.variant-c section[aria-labelledby="stops-title-c"]',
          );
          const feedback = document.querySelector(
            ".variant-c > .inline-arrivals [data-feedback]",
          );
          if (strip) strip.outerHTML = nearestStripMarkup();
          if (list) list.outerHTML = plainStopListMarkup("stops-title-c");
          if (feedback) {
            feedback.textContent = `${activeStop().name}：提交即時到站時間`;
          }
        }

        elements.variantLabel.textContent = `${
          VARIANTS.find((variant) => variant.id === state.variant)?.label ||
          VARIANTS[0].label
        } | ${activeStop().name}`;
        elements.variantLabel.title = `目前選中：${activeStop().name}`;
        updateRouteHeader();
        updateMapSelection();
      }

      function updateRouteHeader() {
        const subtitle = document.querySelector(
          "#route-screen .bar-title small",
        );
        if (subtitle) {
          subtitle.textContent = `校園環線，${routeContextForStop(activeStop())}`;
        }
      }

      function revealSelectedStopInJourney(behavior = "auto") {
        const scroller = document.querySelector(
          ".variant-a:not(.map-closed) .journey-scroll",
        );
        const row = document.querySelector(
          `.variant-a [data-stop-row="${state.stopId}"]`,
        );
        if (!scroller || !row) return;
        const heading = scroller.querySelector(".journey-heading");
        const scrollerTop = scroller.getBoundingClientRect().top;
        const rowTop = row.getBoundingClientRect().top;
        const headingHeight = heading?.offsetHeight || 0;
        scroller.scrollTo({
          top: Math.max(
            0,
            scroller.scrollTop + rowTop - scrollerTop - headingHeight,
          ),
          behavior,
        });
      }

      function selectStop(stopId, source = "list") {
        if (!STOPS.some((stop) => stop.id === stopId)) return;
        state.stopId = stopId;
        state.userSelectedStop = true;
        if (state.mapOpen) state.mapMode = "selected";
        syncUrl(false);
        updateRouteSelection();
        if (routeMap) applyMapCamera(source !== "initial");
        if (state.variant === "a" && state.mapOpen && source !== "initial") {
          requestAnimationFrame(() =>
            revealSelectedStopInJourney(preferredScrollBehavior()),
          );
        }
      }

      function bindRouteInteractions() {
        if (bindRouteInteractions.bound) return;
        bindRouteInteractions.bound = true;
        elements.routeContent.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;

          const feedback = target.closest("[data-feedback]");
          if (feedback) {
            openFeedback(feedback);
            return;
          }

          const viewInList = target.closest("[data-view-in-list]");
          if (viewInList) {
            const row = document.querySelector(
              `[data-stop-row="${state.stopId}"]`,
            );
            row?.scrollIntoView({
              behavior: preferredScrollBehavior(),
              block: "center",
            });
            row
              ?.querySelector("[data-stop-id]")
              ?.focus({ preventScroll: true });
            return;
          }

          const stopButton = target.closest("[data-stop-id]");
          if (stopButton) {
            selectStop(stopButton.dataset.stopId, "list");
            stopButton.focus({ preventScroll: true });
            return;
          }

          if (target.closest("[data-locate]")) {
            state.mapMode = "user";
            syncUrl(false);
            applyMapCamera();
            return;
          }

          if (target.closest("[data-switch-nearby]")) {
            state.nearbyStopId = oppositeRoadStop().id;
            state.stopId = state.nearbyStopId;
            state.userSelectedStop = false;
            state.mapMode = "nearby";
            syncUrl(false);
            updateRouteSelection();
            applyMapCamera();
            requestAnimationFrame(() => {
              document
                .querySelector(`[data-stop-row="${state.stopId}"]`)
                ?.scrollIntoView({
                  behavior: preferredScrollBehavior(),
                  block: "center",
                });
            });
            return;
          }

          if (target.closest("[data-map-toggle]")) {
            state.mapOpen = !state.mapOpen;
            if (state.mapOpen) state.mapMode = "nearby";
            syncUrl(false);
            renderRoute();
          }
        });
      }

      function renderRoute() {
        destroyRouteMap();
        const renderVariant = {
          a: variantAMarkup,
          b: variantBMarkup,
          c: variantCMarkup,
        }[state.variant];
        elements.routeContent.innerHTML = renderVariant();
        elements.variantLabel.textContent = `${
          VARIANTS.find((variant) => variant.id === state.variant)?.label ||
          VARIANTS[0].label
        } | ${activeStop().name}`;
        elements.variantLabel.title = `目前選中：${activeStop().name}`;
        updateRouteHeader();
        bindRouteInteractions();
        initRouteMap();
        if (state.variant === "a" && state.mapOpen) {
          requestAnimationFrame(() => revealSelectedStopInJourney("auto"));
        }
      }

      function currentAppTime() {
        if (
          CLOCK_OVERRIDE &&
          /^([01]\d|2[0-3]):[0-5]\d$/.test(CLOCK_OVERRIDE)
        ) {
          return CLOCK_OVERRIDE;
        }
        return new Intl.DateTimeFormat("zh-HK", {
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
          timeZone: "Asia/Hong_Kong",
        }).format(new Date());
      }

      function hongKongDateParts(date) {
        return Object.fromEntries(
          new Intl.DateTimeFormat("en-CA", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            timeZone: "Asia/Hong_Kong",
          })
            .formatToParts(date)
            .filter((part) => part.type !== "literal")
            .map((part) => [part.type, part.value]),
        );
      }

      function currentFeedbackTimestamp() {
        const now = new Date();
        now.setSeconds(0, 0);
        if (
          !CLOCK_OVERRIDE ||
          !/^([01]\d|2[0-3]):[0-5]\d$/.test(CLOCK_OVERRIDE)
        ) {
          return now;
        }
        const { year, month, day } = hongKongDateParts(now);
        return new Date(`${year}-${month}-${day}T${CLOCK_OVERRIDE}:00+08:00`);
      }

      function formatHongKongTime(date) {
        return new Intl.DateTimeFormat("zh-HK", {
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
          timeZone: "Asia/Hong_Kong",
        }).format(date);
      }

      function feedbackTimestampAtOffset(offset) {
        return new Date(feedbackBaseTimestamp.getTime() - offset * 60_000);
      }

      function feedbackRelativeLabel(offset) {
        return offset === 0 ? "現在" : `${offset} 分鐘前`;
      }

      function updateFeedbackTimeDisplay() {
        const time = formatHongKongTime(feedbackSelectedTimestamp);
        const relative = feedbackRelativeLabel(feedbackMinuteOffset);
        elements.feedbackCurrentTime.textContent = time;
        elements.feedbackCurrentTime.dateTime =
          feedbackSelectedTimestamp.toISOString();
        elements.feedbackTimeRelative.textContent = relative;
        elements.feedbackTimeLater.setAttribute(
          "aria-label",
          `到站時間調後一分鐘，目前 ${time}`,
        );
        elements.feedbackTimeEarlier.setAttribute(
          "aria-label",
          `到站時間調前一分鐘，目前 ${time}`,
        );
      }

      function updateFeedbackStepControls() {
        elements.feedbackTimeLater.disabled =
          feedbackSubmitting || feedbackMinuteOffset === 0;
        elements.feedbackTimeEarlier.disabled =
          feedbackSubmitting || feedbackMinuteOffset === 10;
      }

      function selectFeedbackMinute(offset) {
        const normalizedOffset = Math.max(0, Math.min(10, offset));
        if (normalizedOffset === feedbackMinuteOffset) return;
        feedbackMinuteOffset = normalizedOffset;
        feedbackSelectedTimestamp = feedbackTimestampAtOffset(normalizedOffset);
        updateFeedbackTimeDisplay();
        updateFeedbackStepControls();
      }

      function setFeedbackControlsDisabled(disabled) {
        elements.dialogClose.disabled = disabled;
        elements.cancelFeedback.disabled = disabled;
        elements.feedbackSubmit.disabled = disabled;
        feedbackSubmitting = disabled;
        updateFeedbackStepControls();
      }

      function resetFeedbackDialog() {
        feedbackSubmitting = false;
        elements.feedbackEntry.hidden = false;
        elements.feedbackError.hidden = true;
        elements.feedbackSubmitLabel.textContent = "提交";
        elements.feedbackSubmit.classList.remove("is-loading");
        elements.feedbackForm.removeAttribute("aria-busy");
        setFeedbackControlsDisabled(false);
      }

      function openFeedback(trigger) {
        feedbackTrigger = trigger;
        feedbackBaseTimestamp = currentFeedbackTimestamp();
        feedbackSelectedTimestamp = new Date(feedbackBaseTimestamp);
        feedbackMinuteOffset = 0;
        resetFeedbackDialog();
        elements.feedbackStation.textContent = activeStop().name;
        updateFeedbackTimeDisplay();
        elements.feedbackDialog.showModal();
      }

      function closeFeedback() {
        if (!feedbackSubmitting) elements.feedbackDialog.close();
      }

      function showFeedbackError() {
        feedbackSubmitting = false;
        elements.feedbackForm.removeAttribute("aria-busy");
        elements.feedbackSubmit.classList.remove("is-loading");
        elements.feedbackSubmitLabel.textContent = "重試";
        elements.feedbackError.hidden = false;
        setFeedbackControlsDisabled(false);
        elements.feedbackSubmit.focus({ preventScroll: true });
      }

      function showFeedbackSuccess() {
        feedbackSubmitting = false;
        elements.feedbackForm.removeAttribute("aria-busy");
        const station = activeStop().name;
        const time = formatHongKongTime(feedbackSelectedTimestamp);
        elements.feedbackDialog.close();
        showToast(`謝謝，已匿名記錄：${station} ${time}`);
      }

      function showToast(message) {
        elements.toast.textContent = message;
        elements.toast.classList.add("visible");
        window.clearTimeout(showToast.timeout);
        showToast.timeout = window.setTimeout(() => {
          elements.toast.classList.remove("visible");
        }, 3200);
      }

      function syncUrl(push) {
        const params = new URLSearchParams(window.location.search);
        params.set("view", state.view);
        params.set("tab", state.homeTab);
        params.set("variant", state.variant);
        params.set("nearby", state.nearbyStopId);
        if (state.view === "route") {
          params.set("stop", state.stopId);
          if (state.userSelectedStop) params.set("selected", "1");
          else params.delete("selected");
          if (!state.mapOpen) params.set("map", "closed");
          else if (state.variant === "a") params.set("map", "open");
          else params.delete("map");
          if (state.mapOpen && state.mapMode !== "free") {
            params.set("mapMode", state.mapMode);
          } else params.delete("mapMode");
        } else {
          params.delete("stop");
          params.delete("selected");
          params.delete("map");
          params.delete("mapMode");
        }
        const url = `${window.location.pathname}?${params.toString()}`;
        window.history[push ? "pushState" : "replaceState"]({}, "", url);
      }

      function cycleVariant(direction) {
        const currentIndex = VARIANTS.findIndex(
          (variant) => variant.id === state.variant,
        );
        const nextIndex =
          (currentIndex + direction + VARIANTS.length) % VARIANTS.length;
        state.variant = VARIANTS[nextIndex].id;
        state.mapOpen = true;
        state.mapMode =
          state.variant === "c"
            ? "overview"
            : state.variant === "b"
              ? "selected"
              : "nearby";
        syncUrl(false);
        if (state.view === "route") renderRoute();
      }

      function setView(view, push = false) {
        state.view = view;
        elements.homeScreen.hidden = view !== "home";
        elements.routeScreen.hidden = view !== "route";
        document.querySelector(".prototype-switcher").hidden = true;
        syncUrl(push);
        if (view === "home") {
          destroyRouteMap();
          renderHome();
          document.querySelector("#home-title")?.focus?.();
        } else {
          renderRoute();
          window.scrollTo({ top: 0, behavior: "instant" });
          document
            .querySelector("#route-title")
            ?.focus({ preventScroll: true });
          if (!state.userSelectedStop && state.variant === "a") {
            requestAnimationFrame(() => {
              const target = document.querySelector(
                `[data-stop-row="${state.nearbyStopId}"]`,
              );
              target?.scrollIntoView({
                behavior: "auto",
                block: "center",
              });
            });
          }
        }
      }

      elements.backButton.addEventListener("click", () =>
        setView("home", false),
      );
      elements.dialogClose.addEventListener("click", closeFeedback);
      elements.cancelFeedback.addEventListener("click", closeFeedback);
      elements.feedbackTimeLater.addEventListener("click", () => {
        selectFeedbackMinute(feedbackMinuteOffset - 1);
      });
      elements.feedbackTimeEarlier.addEventListener("click", () => {
        selectFeedbackMinute(feedbackMinuteOffset + 1);
      });
      elements.feedbackDialog.addEventListener("cancel", (event) => {
        if (feedbackSubmitting) event.preventDefault();
      });
      elements.feedbackDialog.addEventListener("close", () => {
        feedbackSubmitting = false;
        if (feedbackTrigger?.isConnected) {
          feedbackTrigger.focus({ preventScroll: true });
        }
        feedbackTrigger = null;
      });
      elements.feedbackForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (feedbackSubmitting) return;
        feedbackSubmitting = true;
        elements.feedbackError.hidden = true;
        elements.feedbackSubmitLabel.textContent = "正在提交…";
        elements.feedbackSubmit.classList.add("is-loading");
        elements.feedbackForm.setAttribute("aria-busy", "true");
        setFeedbackControlsDisabled(true);
        window.setTimeout(() => {
          if (initialParams.get("feedback") === "error") {
            showFeedbackError();
            return;
          }
          showFeedbackSuccess();
        }, 560);
      });
      elements.previousVariant.addEventListener("click", () =>
        cycleVariant(-1),
      );
      elements.nextVariant.addEventListener("click", () => cycleVariant(1));
      elements.variantLabel.addEventListener("click", () => cycleVariant(1));
      document.addEventListener("keydown", (event) => {
        if (
          state.view !== "route" ||
          !["ArrowLeft", "ArrowRight"].includes(event.key)
        )
          return;
        const target = event.target;
        if (
          target instanceof HTMLInputElement ||
          target instanceof HTMLTextAreaElement ||
          target instanceof HTMLSelectElement ||
          target.isContentEditable
        )
          return;
        event.preventDefault();
        cycleVariant(event.key === "ArrowLeft" ? -1 : 1);
      });
      window.addEventListener("popstate", () => {
        const params = new URLSearchParams(window.location.search);
        state.view = params.get("view") === "route" ? "route" : "home";
        state.variant = VARIANTS.some(
          (variant) => variant.id === params.get("variant"),
        )
          ? params.get("variant")
          : "a";
        state.homeTab = ["nearby", "frequent", "favorites"].includes(
          params.get("tab"),
        )
          ? params.get("tab")
          : "nearby";
        state.nearbyStopId = ["shho", "sports"].includes(params.get("nearby"))
          ? params.get("nearby")
          : HOME_STOP_ID;
        state.userSelectedStop = params.get("selected") === "1";
        state.stopId =
          state.userSelectedStop &&
          STOPS.some((stop) => stop.id === params.get("stop"))
            ? params.get("stop")
            : state.nearbyStopId;
        state.mapOpen =
          state.variant === "a" ||
          params.get("map") === "open" ||
          (state.variant !== "a" && params.get("map") !== "closed");
        state.mapMode = ["overview", "nearby", "selected", "user"].includes(
          params.get("mapMode"),
        )
          ? params.get("mapMode")
          : state.variant === "c"
            ? "overview"
            : "nearby";
        setView(state.view, false);
      });

      setView(state.view, false);
    </script>
  </body>
</html>
