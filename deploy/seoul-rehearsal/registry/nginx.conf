user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    # Push clients need authenticated GET/HEAD for v2 discovery and blob checks.
    map $request_method $registry_auth_file {
        default "";
        GET /etc/nginx/rehearsal-reader.htpasswd;
        HEAD /etc/nginx/rehearsal-reader.htpasswd;
        POST /etc/nginx/rehearsal-writer.htpasswd;
        PATCH /etc/nginx/rehearsal-writer.htpasswd;
        PUT /etc/nginx/rehearsal-writer.htpasswd;
    }

    server {
        listen 5443 ssl;
        ssl_certificate /etc/nginx/rehearsal-tls/current/server.crt;
        ssl_certificate_key /etc/nginx/rehearsal-tls/current/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 512m;
        client_body_timeout 120s;
        send_timeout 120s;

        add_header Docker-Distribution-Api-Version registry/2.0 always;

        location ~ ^/v2/(cupedia-rehearsal/.*)?$ {
            if ($registry_auth_file = "") {
                return 405;
            }

            auth_basic "CUpedia rehearsal registry";
            auth_basic_user_file $registry_auth_file;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-For "";
            include /etc/nginx/rehearsal-backend-authorization.conf;
            proxy_hide_header Docker-Distribution-Api-Version;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_redirect off;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_pass http://registry:5000;
        }

        location / {
            return 404;
        }
    }
}
