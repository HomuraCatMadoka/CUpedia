worker_processes 1;
pid logs/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path logs/client-body;
    proxy_temp_path logs/proxy;
    fastcgi_temp_path logs/fastcgi;
    uwsgi_temp_path logs/uwsgi;
    scgi_temp_path logs/scgi;
    server_tokens off;

    # Use the normalized path only. Every log label is a fixed string.
    map $uri $origin_route {
        default "other";
        ~^/courses/?$ "/courses";
        ~^/courses/(achievements|my-reviews)(/|$) "other";
        ~^/courses/[^/]+/?$ "/courses/[code]";
        ~^/wiki/?$ "/wiki";
        ~^/wiki/(history|new|search)(/|$) "other";
        ~^/wiki/[^/].*$ "/wiki/[...id]";
        ~^/(_next/static|assets|college-crests|icons|images)/ "static";
        ~^/(favicon\.ico|manifest\.webmanifest|robots\.txt|sitemap\.xml|file\.svg|globe\.svg|next\.svg|vercel\.svg|window\.svg)$ "static";
    }

    # Nginx's ISO date has whole seconds. Use its matching fractional clock
    # value so reports can use the same time window as millisecond probes.
    map "$time_iso8601:$msec" $origin_time {
        default $time_iso8601;
        "~^(?<origin_date>.+?)(?<origin_zone>[+-][0-9]{2}:[0-9]{2}):[0-9]+\.(?<origin_millis>[0-9]{3})$"
            "$origin_date.$origin_millis$origin_zone";
    }

    log_format origin_json escape=json
        '{"requestId":"$request_id","route":"$origin_route","status":$status,'
        '"bytes":$body_bytes_sent,"requestSeconds":"$request_time",'
        '"upstreamHeaderSeconds":"$upstream_header_time",'
        '"upstreamResponseSeconds":"$upstream_response_time","time":"$origin_time"}';

    upstream cupedia_preview {
        server 127.0.0.1:13135;
        keepalive 16;
    }

    server {
        listen 127.0.0.1:13134;
        access_log logs/origin.jsonl origin_json;
        add_header X-Request-Id $request_id always;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            proxy_hide_header X-Request-Id;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_pass http://cupedia_preview;
        }
    }
}
